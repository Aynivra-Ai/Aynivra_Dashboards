/* ---------------- normalizer: contract <lead>  →  dashboard row ---------------- */
function fmtClock(ms) {
  if (!ms) return "—";
  try { return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  catch { return "—"; }
}
function mapStatus(l) {
  const s = (l.status || "").toLowerCase();
  if (l.visitDate || s === "booked") return "Appointment Set";
  if (["exhausted", "no-answer", "wrong-number", "do-not-call"].includes(s)) return "Missed";
  if (["callback", "human-callback", "review", "interested"].includes(s) || l.needsExec) return "Follow-up";
  return "Completed";
}
function mapTemp(l) {
  const t = (l.temp || "").toLowerCase();
  if (t.startsWith("hot")) return "Hot";
  if (t.startsWith("warm")) return "Warm";
  if (t.startsWith("cold")) return "Cold";
  const st = mapStatus(l);
  if (st === "Appointment Set") return "Hot";
  if (st === "Missed") return "Cold";
  return "Warm";
}
function mapVisit(l) {
  if (l.visitStatus) return l.visitStatus;          // honour explicit passthrough
  if (l.visitAck) return "Visited";
  if (l.visitDate || mapStatus(l) === "Appointment Set") return "Pending";
  return "Pending";
}
function normalize(l, direction) {
  return {
    id: l.leadId || l.id || ("row-" + Math.random().toString(36).slice(2, 7)),
    direction,
    attempts: Number(l.attempts) || 1,
    customerName: l.name || "Unknown",
    phone: l.phone || "—",
    email: l.email || "—",
    timestamp: l.callMs ? fmtClock(l.callMs) : (l.timestamp || "—"),
    duration: l.duration || "—",
    status: mapStatus(l),
    temperature: mapTemp(l),
    intent: l.purpose || l.intent || "—",
    language: l.language || l.lang || "",
    type: l.type || l.campaign || l.category || l.agent || "",
    visitStatus: mapVisit(l),
    visitTime: l.visitTime || l.callbackAt || l.visitDate || "—",
    notes: l.notes || "",
    summary: l.summary || "No summary.",
    recordingUrl: l.recordingUrl || "",
    transcript: Array.isArray(l.transcript) ? l.transcript : []
  };
}
function normalizePayload(p, slug) {
  const inb = (p.inboundLeads || []).map((l) => normalize(l, "Inbound"));
  const out = (p.outboundLeads || []).map((l) => normalize(l, "Outbound"));
  return { rows: [...inb, ...out], generatedAt: p.generatedAt || "" };
}

/* ---------------- fetch layer (Apps Script web app) ---------------- */
function withAction(url, action) {
  return url + (url.includes("?") ? "&" : "?") + "action=" + action;
}
async function loadVertical(v) {
  if (!v.endpoints.payload) {
    return { ...normalizePayload(SAMPLE[v.slug] || { inboundLeads: [], outboundLeads: [] }, v.slug), sample: true, error: "" };
  }
  const res = await fetch(withAction(v.endpoints.payload, "payload") + "&v=" + v.slug, { redirect: "follow" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  return { ...normalizePayload(json, v.slug), sample: false, error: "" };
}
function sendAck(v, leadId, type) {
  if (!v.endpoints.ack) return;
  fetch(withAction(v.endpoints.ack, "ack") + "&leadId=" + encodeURIComponent(leadId) + "&type=" + type).catch(() => {});
}
async function openSheet(v) {
  if (!v.endpoints.sheet) { alert("No sheet URL wired for this vertical yet."); return; }
  try {
    const r = await fetch(withAction(v.endpoints.sheet, "sheeturl"), { redirect: "follow" });
    const j = await r.json();
    if (j && j.ok && j.url) window.open(j.url, "_blank", "noopener");
    else alert("Could not get the sheet link.");
  } catch { alert("Could not get the sheet link."); }
}

  const [calls, setCalls] = useState([]);
  const [meta, setMeta] = useState({ sample: true, generatedAt: "", error: "" });
  const [loading, setLoading] = useState(true);

  const [scope, setScope] = useState("All");
  const [statusFilter, setStatusFilter] = useState("All");
  const [langFilter, setLangFilter] = useState("All");
  const [subKey, setSubKey] = useState("");
  const [search, setSearch] = useState("");
  const [sel, setSel] = useState(null);
  const [nav, setNav] = useState("overview");
  const [sidebar, setSidebar] = useState(false);
  const [vmenu, setVmenu] = useState(false);
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const timer = useRef(null);
  const refOv = useRef(null), refL = useRef(null);

  useEffect(() => { document.documentElement.style.setProperty("--accent", v.accent); }, [v]);

  // react to #hash changes (deep links like /travel/#travel)
  useEffect(() => {
    const onHash = () => setSlug(slugFromHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  // load + poll whenever vertical changes
  useEffect(() => {
    let alive = true;
    const run = async (isPoll) => {
      if (!isPoll) setLoading(true);
      try {
        const r = await loadVertical(v);
        if (!alive) return;
        setCalls(r.rows);
        setMeta({ sample: r.sample, generatedAt: r.generatedAt, error: "" });
      } catch (e) {
        if (!alive) return;
        setCalls([]);
        setMeta({ sample: false, generatedAt: "", error: String(e.message || e) });
      } finally { if (alive) setLoading(false); }
    };
    run(false);
    let id;
    if (CFG.pollMs > 0 && v.endpoints.payload) id = setInterval(() => run(true), CFG.pollMs);
    return () => { alive = false; if (id) clearInterval(id); };
  }, [v]);

  useEffect(() => {
    if (playing) timer.current = setInterval(() => setProgress((p) => (p >= 100 ? (setPlaying(false), 0) : p + 2)), 300);
    else clearInterval(timer.current);
    return () => clearInterval(timer.current);
  }, [playing]);

  const pickVertical = (s) => { setVmenu(false); setSidebar(false); if (s !== slug) { setSlug(s); location.hash = s; setScope("All"); setStatusFilter("All"); setLangFilter("All"); setSubKey(""); setSearch(""); setSel(null); } };

  const setVisit = (id, val) => {
    setCalls((p) => p.map((c) => (c.id === id ? { ...c, visitStatus: val } : c)));
    setSel((p) => (p && p.id === id ? { ...p, visitStatus: val } : p));
    if (val === "Visited") sendAck(v, id, "visit");
  };
  const setNotes = (id, n) => setCalls((p) => p.map((c) => (c.id === id ? { ...c, notes: n } : c)));
  const retry = (id) => setCalls((p) => p.map((c) => (c.id === id ? { ...c, attempts: Math.min(c.attempts + 1, CFG.maxAttempts) } : c)));
  const openRec = (c) => { setSel(c); setPlaying(false); setProgress(0); };
  const go = (key, r) => { setNav(key); setSidebar(false); r?.current?.scrollIntoView({ behavior: "smooth", block: "start" }); };

  const inScope = (c) => scope === "All" || c.direction === scope;

  // sub-agents: two agents on one shared endpoint, split by a pill
  const activeSub = useMemo(() => {
    if (!v.subAgents || !v.subAgents.length) return null;
    return v.subAgents.find((s) => s.key === subKey) || v.subAgents[0];
  }, [v, subKey]);
  const subMatch = (c) => {
    if (!activeSub) return true;
    if (activeSub.filterField) return String(c[activeSub.filterField] || "").toLowerCase().includes(String(activeSub.filterValue || "").toLowerCase());
    const hay = (c.intent + " " + c.summary + " " + c.type).toLowerCase();
    const isPay = /payment|pending due|invoice|emi|dues|overdue|outstanding|install?ment|balance|unpaid/.test(hay);
    return activeSub.key === "payment" ? isPay : !isPay;
  };
  const base = useMemo(() => calls.filter(subMatch), [calls, activeSub]);
  const languages = useMemo(() => Array.from(new Set(base.map((c) => c.language).filter(Boolean))), [base]);

  const stat = (dir) => {
    const list = base.filter((c) => c.direction === dir);
    const booked = list.filter((c) => c.status === "Appointment Set").length;
    return { total: list.length, booked };
  };
  const inb = useMemo(() => stat("Inbound"), [base]);
  const out = useMemo(() => stat("Outbound"), [base]);

  const k = useMemo(() => {
    const list = base.filter(inScope);
    const booked = list.filter((c) => c.status === "Appointment Set").length;
    const visited = list.filter((c) => c.visitStatus === "Visited").length;
    const noShow = list.filter((c) => c.visitStatus === "No-Show").length;
    const decided = visited + noShow;
    return { total: list.length, booked, visited, noShow, showRate: decided ? Math.round((visited / decided) * 100) : 0, callToVisit: list.length ? Math.round((visited / list.length) * 100) : 0, needsAction: list.filter(actionOf).length };
  }, [base, scope]);

  const filtered = useMemo(() => base.filter((c) => {
    const q = search.toLowerCase();
    return inScope(c) && (statusFilter === "All" || c.status === statusFilter) && (langFilter === "All" || c.language === langFilter) &&
      (c.customerName.toLowerCase().includes(q) || c.phone.includes(search) || c.intent.toLowerCase().includes(q) || c.id.toLowerCase().includes(q));
  }), [base, scope, statusFilter, langFilter, search]);

  const tempData = useMemo(() => { const l = base.filter(inScope); return [{ name: "Hot", value: l.filter((c) => c.temperature === "Hot").length, color: "#f59e0b" }, { name: "Warm", value: l.filter((c) => c.temperature === "Warm").length, color: "#06b6d4" }, { name: "Cold", value: l.filter((c) => c.temperature === "Cold").length, color: "#94a3b8" }].filter((d) => d.value > 0); }, [base, scope]);
  const outcomeData = useMemo(() => { const l = base.filter(inScope); return [{ name: "Visited", value: l.filter((c) => c.visitStatus === "Visited").length, color: "#10b981" }, { name: "Pending", value: l.filter((c) => c.visitStatus === "Pending").length, color: "#f59e0b" }, { name: "No-show", value: l.filter((c) => c.visitStatus === "No-Show").length, color: "#fb7185" }].filter((d) => d.value > 0); }, [base, scope]);
  const channelData = useMemo(() => [{ name: "Incoming", value: inb.total, color: "#10b981" }, { name: "Outgoing", value: out.total, color: "#8b5cf6" }].filter((d) => d.value > 0), [inb, out]);

  const exportCSV = () => {
    const head = ["ID", "Direction", "Attempts", "Name", "Phone", "Language", "Status", "Temp", "Intent", "Visit", "VisitTime", "Notes"];
    const rows = base.map((c) => [c.id, c.direction, c.attempts, c.customerName, c.phone, c.language, c.status, c.temperature, c.intent, c.visitStatus, c.visitTime, c.notes].map((x) => `"${String(x).replace(/"/g, '""')}"`).join(","));
    const b = new Blob([[head.join(","), ...rows].join("\n")], { type: "text/csv" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `${CFG.brand}_${v.slug}_calls.csv`; a.click(); URL.revokeObjectURL(a.href);
  };

  const NavItem = ({ ic, label, active, onClick, right }) => (
    <button onClick={onClick} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium transition-colors ${active ? "text-slate-900" : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"}`} style={active ? { background: v.accent + "14", color: v.accent } : {}}>
      <Ic n={ic} className="w-4 h-4 shrink-0" /><span className="flex-1 text-left truncate">{label}</span>{right}
    </button>
  );
  const scopeDot = (x) => x === "Inbound" ? "bg-emerald-500" : x === "Outbound" ? "bg-violet-500" : "bg-slate-400";

  return (
    <div className="min-h-screen bg-white text-slate-900" style={{ fontFamily: "ui-sans-serif, system-ui, sans-serif" }}>
      {sidebar && <div className="fixed inset-0 z-40 bg-black/30 lg:hidden" onClick={() => setSidebar(false)} />}
      <aside className={`fixed z-50 inset-y-0 left-0 w-60 bg-white border-r border-slate-200 flex flex-col transition-transform ${sidebar ? "translate-x-0" : "-translate-x-full"} lg:translate-x-0`}>
        {/* brand + vertical switcher */}
        <div className="px-4 pt-4 pb-3 border-b border-slate-200">
          <div className="flex items-center gap-2.5 mb-3">
            <div className="w-9 h-9 rounded-xl flex items-center justify-center text-white shrink-0" style={{ background: v.accent }}><Ic n="phone" className="w-4 h-4" /></div>
            <div className="min-w-0"><div className="text-sm font-bold truncate">{CFG.brand} Call Desk</div><div className="text-[11px] text-slate-500 truncate">Agent · {v.agent}</div></div>
            <button onClick={() => setSidebar(false)} className="ml-auto lg:hidden text-slate-400"><Ic n="x" className="w-5 h-5" /></button>
          </div>
          <div className="relative">
            <button onClick={() => setVmenu((m) => !m)} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-sm font-semibold">
              <span className="w-2 h-2 rounded-full shrink-0" style={{ background: v.accent }} />
              <span className="flex-1 text-left truncate">{v.label}</span>
              <Ic n="chevron" className={`w-4 h-4 text-slate-400 transition-transform ${vmenu ? "rotate-180" : ""}`} />
            </button>
            {vmenu && (
              <div className="absolute z-20 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg overflow-hidden">
                {CFG.verticals.map((x) => (
                  <button key={x.slug} onClick={() => pickVertical(x.slug)} className={`w-full flex items-center gap-2 px-3 py-2 text-sm text-left hover:bg-slate-50 ${x.slug === slug ? "font-bold" : "font-medium text-slate-600"}`}>
                    <span className="w-2 h-2 rounded-full shrink-0" style={{ background: x.accent }} />
                    <span className="flex-1 truncate">{x.label}</span>
                    {x.slug === slug && <Ic n="check" className="w-3.5 h-3.5" style={{ color: v.accent }} />}
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>

        <nav className="flex-1 overflow-y-auto p-3 space-y-5">
          <div className="space-y-1">
            <p className="px-3 text-[10px] font-bold text-slate-400 tracking-wider mb-1">MAIN</p>
            <NavItem ic="dash" label="Overview" active={nav === "overview"} onClick={() => go("overview", refOv)} />
            <NavItem ic="filter" label="Call log" active={nav === "log"} onClick={() => go("log", refL)} />
          </div>
          <div className="space-y-1">
            <p className="px-3 text-[10px] font-bold text-slate-400 tracking-wider mb-1">CHANNELS</p>
            {["All", "Inbound", "Outbound"].map((x) => (
              <button key={x} onClick={() => setScope(x)} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium transition-colors ${scope === x ? "bg-slate-100 text-slate-900" : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"}`}>
                <span className={`w-2 h-2 rounded-full ${scopeDot(x)}`} /><span className="flex-1 text-left">{dirLabel(x)}</span><span className="text-[11px] text-slate-400">{x === "Inbound" ? inb.total : x === "Outbound" ? out.total : base.length}</span>
              </button>
            ))}
          </div>
          <div className="space-y-1">
            <p className="px-3 text-[10px] font-bold text-slate-400 tracking-wider mb-1">STATUS</p>
            {["All", "Appointment Set", "Follow-up", "Missed"].map((x) => (
              <button key={x} onClick={() => { setStatusFilter(x); go("log", refL); }} className={`w-full flex items-center px-3 py-1.5 rounded-lg text-[13px] font-medium transition-colors ${statusFilter === x ? "text-slate-900 bg-slate-100" : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"}`}>{x === "Appointment Set" ? v.bookingNoun + " set" : x}</button>
            ))}
          </div>
        </nav>
        <div className="p-3 border-t border-slate-200 space-y-2">
          <button onClick={() => openSheet(v)} className="w-full flex items-center justify-center gap-2 text-white font-semibold text-sm py-2 rounded-lg" style={{ background: v.accent }}><Ic n="list" className="w-4 h-4" /> Open sheet</button>
          <button onClick={exportCSV} className="w-full flex items-center justify-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm py-2 rounded-lg border border-slate-200"><Ic n="download" className="w-4 h-4" /> Export CSV</button>
        </div>
      </aside>

      <div className="lg:pl-60">
        <div className="lg:hidden sticky top-0 z-30 h-14 bg-white/90 backdrop-blur border-b border-slate-200 flex items-center gap-3 px-4">
          <button onClick={() => setSidebar(true)} className="text-slate-600"><Ic n="menu" className="w-5 h-5" /></button>
          <span className="font-bold text-sm truncate">{v.label}</span>
          <span className="ml-auto flex items-center gap-1 text-[11px]" style={{ color: meta.sample ? "#64748b" : "#059669" }}><Ic n="radio" className="w-3.5 h-3.5" /> {meta.sample ? "Sample" : "Live"}</span>
        </div>

        <main className="p-4 sm:p-6 space-y-6 max-w-[1400px]">
          {/* status banners */}
          {meta.error && <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold rounded-xl px-4 py-2.5">Couldn't reach {v.label} endpoint: {meta.error}. Check the web-app URL and that it returns JSON.</div>}
          {!meta.error && meta.sample && <div className="bg-amber-50 border border-amber-200 text-amber-800 text-xs font-semibold rounded-xl px-4 py-2.5">Showing sample data — no endpoint wired for {v.label} yet. Fill its <code>endpoints.payload</code> URL in the config block.</div>}

          {v.subAgents && v.subAgents.length > 0 && (
            <div className="inline-flex rounded-xl border border-slate-200 bg-slate-50 p-1 gap-1">
              {v.subAgents.map((s) => {
                const on = (activeSub && activeSub.key === s.key);
                return (
                  <button key={s.key} onClick={() => setSubKey(s.key)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${on ? "text-white shadow-sm" : "text-slate-600 hover:text-slate-900"}`} style={on ? { background: v.accent } : {}}>{s.label}</button>
                );
              })}
            </div>
          )}

          <section ref={refOv} style={{ scrollMarginTop: 72 }}>
            <div className="flex items-center justify-between mb-3">
              <h1 className="text-lg font-bold">{v.label}{scope !== "All" && <span className="text-slate-400 font-medium"> · {dirLabel(scope)}</span>}</h1>
              <span className="hidden lg:flex items-center gap-1.5 text-xs" style={{ color: meta.sample ? "#64748b" : "#059669" }}><Ic n="radio" className="w-3.5 h-3.5" /> {loading ? "Loading…" : meta.sample ? "Sample data" : "Live" + (meta.generatedAt ? " · " + meta.generatedAt : "")}</span>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2 sm:gap-3">
              <Kpi ic="calCheck" value={k.booked} label={v.bookingNoun} sub="booked" color={v.accent} />
              <Kpi ic="userCheck" value={k.visited} label="Showed up" sub={`${k.showRate}% show`} color="#10b981" />
              <Kpi ic="missed" value={k.noShow} label="No-shows" sub={k.noShow ? "needs chase" : "none"} color="#fb7185" />
              <Kpi ic="flame" value={k.needsAction} label="Needs action" sub="to follow up" color="#f59e0b" accent />
              <Kpi ic="trend" value={k.callToVisit} suffix="%" label="Call → visit" sub={`${k.visited}/${k.total}`} color="#06b6d4" />
            </div>
          </section>

          <section className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-stretch">
            <Panel title="Calls, booked & visits" note="last 7 days" sample>
              <div style={{ height: 240 }}>
                <ResponsiveContainer width="100%" height="100%">
                  <AreaChart data={TREND7} margin={{ top: 10, right: 8, left: -18, bottom: 0 }}>
                    <defs>
                      <linearGradient id="gCalls" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#06b6d4" stopOpacity={0.35} /><stop offset="100%" stopColor="#06b6d4" stopOpacity={0} /></linearGradient>
                      <linearGradient id="gBooked" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={v.accent} stopOpacity={0.35} /><stop offset="100%" stopColor={v.accent} stopOpacity={0} /></linearGradient>
                      <linearGradient id="gVisits" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#10b981" stopOpacity={0.35} /><stop offset="100%" stopColor="#10b981" stopOpacity={0} /></linearGradient>
                    </defs>
                    <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" vertical={false} />
                    <XAxis dataKey="d" tick={{ fill: "#64748b", fontSize: 11 }} axisLine={false} tickLine={false} />
                    <YAxis tick={{ fill: "#64748b", fontSize: 11 }} axisLine={false} tickLine={false} />
                    <Tooltip content={<LightTip />} />
                    <Area type="monotone" dataKey="calls" stroke="#06b6d4" strokeWidth={2} fill="url(#gCalls)" />
                    <Area type="monotone" dataKey="booked" stroke={v.accent} strokeWidth={2} fill="url(#gBooked)" />
                    <Area type="monotone" dataKey="visits" stroke="#10b981" strokeWidth={2} fill="url(#gVisits)" />
                  </AreaChart>
                </ResponsiveContainer>
              </div>
              <Legend3 items={[["Calls", "#06b6d4"], ["Booked", v.accent], ["Visits", "#10b981"]]} />
            </Panel>
            <Panel title="Calls by day" note="last 7 days" sample>
              <div style={{ height: 240 }}>
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={TREND7} margin={{ top: 10, right: 8, left: -22, bottom: 0 }}>
                    <defs><linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={v.accent} /><stop offset="100%" stopColor="#06b6d4" /></linearGradient></defs>
                    <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" vertical={false} />
                    <XAxis dataKey="d" tick={{ fill: "#64748b", fontSize: 11 }} axisLine={false} tickLine={false} />
                    <YAxis tick={{ fill: "#64748b", fontSize: 11 }} axisLine={false} tickLine={false} />
                    <Tooltip content={<LightTip />} cursor={{ fill: "#f1f5f9" }} />
                    <Bar dataKey="calls" fill="url(#gBar)" radius={[4, 4, 0, 0]} />
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </Panel>
          </section>

          <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 items-stretch">
            <Panel title="Lead temperature" note="live"><Donut data={tempData} total={k.total} /></Panel>
            <Panel title="Visit outcome" note="live"><Donut data={outcomeData} total={k.total} /></Panel>
            <Panel title="Incoming vs outgoing" note="live"><Donut data={channelData} total={inb.total + out.total} /></Panel>
          </section>

          <section ref={refL} style={{ scrollMarginTop: 72 }} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-3 sm:p-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
              <h2 className="text-sm font-bold">Call log</h2>
              <div className="flex items-center gap-2 flex-1 min-w-0 max-w-md">
                <div className="relative flex-1"><Ic n="search" className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" /><input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search…" className="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none" style={{ "--tw-ring-color": v.accent }} /></div>
                <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-lg px-2 py-1.5 font-semibold focus:outline-none"><option value="All">All status</option><option value="Appointment Set">{v.bookingNoun} set</option><option>Completed</option><option>Follow-up</option><option>Missed</option></select>
                {languages.length > 0 && (
                  <select value={langFilter} onChange={(e) => setLangFilter(e.target.value)} className="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-lg px-2 py-1.5 font-semibold focus:outline-none"><option value="All">All languages</option>{languages.map((lg) => <option key={lg} value={lg}>{lg}</option>)}</select>
                )}
              </div>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left">
                <thead><tr className="bg-slate-50 border-b border-slate-200 text-[10px] font-bold text-slate-400 tracking-wider"><th className="py-2.5 px-4">CONTACT</th><th className="py-2.5 px-4">LANG</th><th className="py-2.5 px-4">STATUS</th><th className="py-2.5 px-4">TEMP</th><th className="py-2.5 px-4">INTENT</th><th className="py-2.5 px-4">TRIES</th><th className="py-2.5 px-4">VISIT</th><th className="py-2.5 px-4 text-right">CALL</th></tr></thead>
                <tbody className="divide-y divide-slate-100 text-xs">
                  {filtered.map((c) => {
                    const ch = CH[c.direction];
                    return (
                      <tr key={c.id} className="hover:bg-slate-50">
                        <td className="py-2.5 px-4 whitespace-nowrap"><div className="flex items-center gap-2.5"><div className={`p-1.5 rounded-lg ${ch.bg} ${ch.text}`}><Ic n={ch.icon} className="w-3.5 h-3.5" /></div><div><div className="font-bold text-slate-900 text-sm">{c.customerName}</div><div className="text-slate-500 text-[11px]">{c.phone} · {c.timestamp}</div></div></div></td>
                        <td className="py-2.5 px-4 whitespace-nowrap">{c.language ? <span className="inline-block bg-slate-100 text-slate-600 border border-slate-200 px-2 py-0.5 rounded-md text-[11px] font-semibold">{c.language}</span> : <span className="text-[11px] text-slate-300">—</span>}</td>
                        <td className="py-2.5 px-4 whitespace-nowrap"><span className={`inline-flex px-2 py-0.5 rounded-full text-[11px] font-semibold border ${STATUS[c.status]}`}>{c.status === "Appointment Set" ? v.bookingNoun + " set" : c.status}</span></td>
                        <td className="py-2.5 px-4 whitespace-nowrap"><TempChip t={c.temperature} /></td>
                        <td className="py-2.5 px-4 whitespace-nowrap"><span className="inline-block truncate bg-slate-100 text-slate-700 px-2 py-0.5 rounded-lg text-[11px] font-semibold border border-slate-200" style={{ maxWidth: 150 }} title={c.intent}>{c.intent}</span></td>
                        <td className="py-2.5 px-4 whitespace-nowrap">{c.direction === "Outbound" ? <span className={`text-[11px] font-bold ${c.attempts >= CFG.maxAttempts ? "text-rose-600" : "text-slate-600"}`}>{c.attempts}/{CFG.maxAttempts}</span> : <span className="text-[11px] text-slate-300">—</span>}</td>
                        <td className="py-2.5 px-4 whitespace-nowrap"><div className="inline-flex rounded-lg border border-slate-200 overflow-hidden">{["Visited", "Pending", "No-Show"].map((s) => (<button key={s} onClick={() => setVisit(c.id, s)} className={`px-1.5 py-0.5 text-[11px] font-semibold ${c.visitStatus === s ? s === "Visited" ? "bg-emerald-500 text-white" : s === "Pending" ? "bg-amber-500 text-white" : "bg-rose-500 text-white" : "bg-white text-slate-500 hover:bg-slate-50"}`}>{s === "No-Show" ? "No-show" : s}</button>))}</div></td>
                        <td className="py-2.5 px-4 whitespace-nowrap text-right"><button onClick={() => openRec(c)} className="inline-flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white px-2.5 py-1 rounded-lg text-xs font-semibold"><Ic n="vol" className="w-3.5 h-3.5" /> Recording</button></td>
                      </tr>
                    );
                  })}
                  {!loading && filtered.length === 0 && <tr><td colSpan={8} className="py-8 text-center text-sm text-slate-400">No calls match.</td></tr>}
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>

      {sel && (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex justify-end" onClick={() => setSel(null)}>
          <div className="w-full max-w-xl bg-white h-full shadow-2xl flex flex-col border-l border-slate-200" onClick={(e) => e.stopPropagation()}>
            <div className="p-5 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
              <div className="flex items-center gap-3"><div className={`p-2 rounded-xl ${CH[sel.direction].bg} ${CH[sel.direction].text}`}><Ic n={CH[sel.direction].icon} className="w-5 h-5" /></div><div><h3 className="font-bold">{sel.customerName}</h3><p className="text-xs text-slate-500">{sel.phone} · {dirLabel(sel.direction)} · {sel.timestamp}</p></div></div>
              <button onClick={() => setSel(null)} className="p-2 text-slate-400 hover:text-slate-700 rounded-lg hover:bg-slate-200/60"><Ic n="x" className="w-5 h-5" /></button>
            </div>
            <div className="flex-1 overflow-y-auto p-6 space-y-5">
              {sel.direction === "Outbound" && (<div className="flex items-center justify-between rounded-xl px-4 py-2.5 border" style={{ background: v.accent + "10", borderColor: v.accent + "33" }}><span className="text-xs font-semibold" style={{ color: v.accent }}>Dial attempts: {sel.attempts} of {CFG.maxAttempts}</span>{sel.status === "Missed" && sel.attempts < CFG.maxAttempts && (<button onClick={() => retry(sel.id)} className="flex items-center gap-1.5 text-white text-xs font-semibold px-3 py-1.5 rounded-lg" style={{ background: v.accent }}><Ic n="retry" className="w-3.5 h-3.5" /> Log retry</button>)}</div>)}
              <div className="bg-slate-900 text-white p-5 rounded-2xl space-y-4">
                <div className="flex items-center justify-between text-xs text-slate-300"><span className="flex items-center gap-1.5 font-semibold text-cyan-400"><Ic n="vol" className="w-4 h-4" /> Recording</span><span>{sel.duration}</span></div>
                {sel.recordingUrl
                  ? <audio controls src={sel.recordingUrl} className="w-full" style={{ height: 36 }} />
                  : <>
                      <div className="h-10 flex items-center gap-1">{[40, 60, 20, 80, 95, 45, 70, 30, 85, 60, 40, 90, 75, 50, 30, 80, 100, 65, 40, 20, 85, 90, 50].map((h, i) => (<div key={i} style={{ height: `${h}%` }} className={`flex-1 rounded-full ${(i / 23) * 100 <= progress ? "bg-cyan-400" : "bg-slate-700"}`} />))}</div>
                      <div className="flex items-center justify-between"><button onClick={() => setPlaying(!playing)} className="flex items-center gap-2 bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-semibold text-xs px-4 py-2 rounded-lg"><Ic n={playing ? "pause" : "play"} className="w-4 h-4" /> {playing ? "Pause" : "Play"}</button><span className="text-xs text-slate-400 font-mono">{progress}%</span></div>
                      <p className="text-[10px] text-slate-500">No recording URL on this lead — demo waveform.</p>
                    </>}
              </div>
              <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2"><div className="flex items-center gap-1.5 font-bold text-xs"><Ic n="spark" className="w-4 h-4 text-amber-500" /> Call summary</div><p className="text-xs text-slate-700 leading-relaxed">{sel.summary}</p><div className="pt-1 flex flex-wrap gap-2"><TempChip t={sel.temperature} /><span className={`px-2 py-0.5 rounded-md text-[11px] font-semibold border ${STATUS[sel.status]}`}>{sel.status === "Appointment Set" ? v.bookingNoun + " set" : sel.status}</span><span className="bg-white text-slate-600 border border-slate-200 px-2 py-0.5 rounded-md text-[11px] font-semibold">Intent: {sel.intent}</span></div></div>
              <div className="p-4 rounded-2xl border border-slate-200 space-y-3"><div className="flex items-center justify-between"><span className="text-xs font-bold">{v.bookingNoun} status</span><div className="inline-flex rounded-lg border border-slate-200 overflow-hidden">{["Visited", "Pending", "No-Show"].map((s) => (<button key={s} onClick={() => setVisit(sel.id, s)} className={`px-2.5 py-1 text-[11px] font-semibold ${sel.visitStatus === s ? s === "Visited" ? "bg-emerald-500 text-white" : s === "Pending" ? "bg-amber-500 text-white" : "bg-rose-500 text-white" : "bg-white text-slate-500 hover:bg-slate-50"}`}>{s === "No-Show" ? "No-show" : s}</button>))}</div></div><input defaultValue={sel.notes} onBlur={(e) => setNotes(sel.id, e.target.value)} placeholder="Add a note…" className="fld" /></div>
              <div className="space-y-3"><h4 className="text-xs font-bold text-slate-400 tracking-wider">TRANSCRIPT</h4>{sel.transcript.length === 0 && <p className="text-xs text-slate-400">No transcript for this call.</p>}{sel.transcript.map((l, i) => (<div key={i} className={`p-3 rounded-2xl text-xs space-y-1 ${l.speaker === "Agent" ? "bg-slate-100 mr-6" : "bg-cyan-50 ml-6 border border-cyan-100"}`}><div className="flex items-center justify-between font-bold"><span className={l.speaker === "Agent" ? "text-slate-700" : "text-cyan-700"}>{l.speaker === "Agent" ? `${v.agent} (AI)` : sel.customerName}</span><span className="text-[10px] text-slate-400 font-mono">{l.time}</span></div><p className="text-slate-700 leading-relaxed">{l.text}</p></div>))}</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- presentational ---------------- */
function useCountUp(target) {
  const [n, setN] = useState(0); const mounted = useRef(false);
  useEffect(() => {
    if (typeof target !== "number") { setN(target); return; }
    const reduce = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || target === 0) { setN(target); return; }
    let raf, start; const step = (t) => { if (!start) start = t; const p = Math.min((t - start) / 600, 1); setN(Math.round(target * p)); if (p < 1) raf = requestAnimationFrame(step); }; raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return n;
}
function Kpi({ ic, value, label, sub, color, suffix = "", accent }) {
  const n = useCountUp(value);
  return (
    <div className={`bg-white rounded-xl border p-3 shadow-sm flex flex-col justify-between`} style={{ minHeight: 92, borderColor: accent ? "#fcd34d" : "#e2e8f0" }}>
      <div className="flex items-center justify-between"><span className="text-[11px] font-bold uppercase tracking-wide text-slate-500">{label}</span><div className="p-1 rounded-md" style={{ background: color + "1a", color }}><Ic n={ic} className="w-3.5 h-3.5" /></div></div>
      <div className="flex items-baseline gap-1.5 mt-1"><span className="text-2xl font-extrabold" style={{ color: accent ? color : "#0f172a" }}>{n}{suffix}</span><span className="text-[10px] text-slate-400 font-medium truncate">{sub}</span></div>
    </div>
  );
}
function Panel({ title, note, sample, children }) {
  return (
    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
      <div className="flex items-center justify-between mb-2"><h3 className="text-sm font-bold">{title}</h3>{sample ? <span className="text-[10px] font-bold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full">sample history</span> : <span className="text-[10px] text-slate-400">{note}</span>}</div>
      {children}
    </div>
  );
}
function LightTip({ active, payload, label }) {
  if (!active || !payload || !payload.length) return null;
  return (<div className="bg-white border border-slate-200 rounded-lg px-3 py-2 text-xs shadow-lg"><div className="font-bold text-slate-700 mb-1">{label}</div>{payload.map((p, i) => (<div key={i} className="flex items-center gap-2 text-slate-600"><span className="w-2 h-2 rounded-full" style={{ background: p.color }} />{p.name}: <span className="font-bold text-slate-900">{p.value}</span></div>))}</div>);
}
function Legend3({ items }) { return (<div className="flex items-center gap-4 mt-2 justify-center">{items.map(([l, c]) => (<span key={l} className="flex items-center gap-1.5 text-[11px] text-slate-500 font-semibold"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: c }} />{l}</span>))}</div>); }
function Donut({ data, total }) {
  if (!data.length) return <div className="h-[200px] flex items-center justify-center text-xs text-slate-400">No data in scope.</div>;
  return (
    <div className="relative" style={{ height: 200 }}>
      <ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={data} dataKey="value" nameKey="name" innerRadius={55} outerRadius={78} paddingAngle={2} stroke="none">{data.map((d, i) => <Cell key={i} fill={d.color} />)}</Pie><Tooltip content={<LightTip />} /></PieChart></ResponsiveContainer>
      <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none"><span className="text-2xl font-extrabold text-slate-900">{total}</span><span className="text-[10px] text-slate-400 font-semibold">total</span></div>
      <div className="flex items-center justify-center gap-3 flex-wrap -mt-1">{data.map((d) => (<span key={d.name} className="flex items-center gap-1.5 text-[11px] text-slate-500 font-semibold"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: d.color }} />{d.name} <span className="text-slate-400">{d.value}</span></span>))}</div>
    </div>
  );
}
function TempChip({ t }) { return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold border ${TEMP[t]}`}>{t}</span>; }

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
